<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" width="100%" height="100%">
  <rect x="0" y="0" width="800" height="350" rx="10" ry="10" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <rect x="0" y="0" width="800" height="30" rx="10" ry="10" fill="#161b22"/>
  <circle cx="20" cy="15" r="6" fill="#ff5f56"/>
  <circle cx="40" cy="15" r="6" fill="#ffbd2e"/>
  <circle cx="60" cy="15" r="6" fill="#27c93f"/>
  <text x="400" y="20" font-family="'Fira Code', monospace" font-size="12" fill="#8b949e" text-anchor="middle">julio@macbook-pro: ~</text>

  <style>
    .text { font-family: 'Fira Code', Consolas, monospace; font-size: 15px; fill: #c9d1d9; }
    .prompt { fill: #FF6F00; font-weight: bold; }
    .cmd { fill: #79c0ff; }
    .success { fill: #3fb950; font-weight: bold; }
    .line { opacity: 0; animation: showLine 0.1s forwards; }
    .l1 { animation-delay: 0.8s; }
    .l2 { animation-delay: 1.6s; }
    .l3 { animation-delay: 2.4s; }
    .l4 { animation-delay: 3.2s; }
    .l5 { animation-delay: 4.0s; }
    .l6 { animation-delay: 4.8s; }
    .l7 { animation-delay: 5.6s; }
    @keyframes showLine { to { opacity: 1; } }
    .cursor { fill: #c9d1d9; animation: blink 1s step-end infinite; opacity: 0; }
    .cursor-active { animation-delay: 5.6s; }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
  </style>

  <text x="20" y="65" class="text prompt">julio@macbook-pro:~$ <tspan class="cmd">./deploy_ai_architect.sh</tspan></text>
  <text x="20" y="100" class="text line l1">[+] Iniciando protocolos de Inteligencia Artificial...</text>
  <text x="20" y="130" class="text line l2">[+] Cargando Core Dev: Python 3.11, JavaScript (ES6+), C++</text>
  <text x="20" y="160" class="text line l3">[+] Conectando Modelos LLM: Google Gemini, ChatGPT, Claude</text>
  <text x="20" y="190" class="text line l4">[+] Desplegando Workflows: Pipelines automatizados en n8n [OK]</text>
  <text x="20" y="220" class="text line l5">[+] Base de Datos Vectorial: FAISS Index sincronizado.</text>
  <text x="20" y="260" class="text success line l6">SUCCESS: Senior Full Stack Developer &amp; AI Engineer listos para operar.</text>
  <text x="20" y="305" class="text prompt line l7">julio@macbook-pro:~$ <tspan class="cursor cursor-active">_</tspan></text>
</svg>
